services:
  proofcanvas:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PROOFCANVAS_APP_ORIGIN: ${PROOFCANVAS_APP_ORIGIN:?set the exact public HTTPS origin}
      PROOFCANVAS_OWNER_PASSWORD_HASH: ${PROOFCANVAS_OWNER_PASSWORD_HASH:?set the scrypt owner password hash}
      PROOFCANVAS_SESSION_SECRET: ${PROOFCANVAS_SESSION_SECRET:?set an independent canonical 32-byte secret}
      PROOFCANVAS_DATA_DIR: /var/lib/proofcanvas
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PROOFCANVAS_OPENAI_MODEL: ${PROOFCANVAS_OPENAI_MODEL:-}
      PROOFCANVAS_RENDER_URL: http://proofcanvas-render:8080/
      PROOFCANVAS_RENDER_TOKEN: ${PROOFCANVAS_RENDER_TOKEN:?set one private 32-256 character renderer token}
    volumes:
      - proofcanvas-data:/var/lib/proofcanvas
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    memswap_limit: 3g
    stop_grace_period: 30s
    depends_on:
      proofcanvas-render:
        condition: service_healthy
    networks:
      - edge
      - render-private
    logging:
      options:
        max-size: 10m
        max-file: "3"

  proofcanvas-render:
    build:
      context: ./services/proofcanvas-render
      target: proofcanvas-render-runtime
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      PROOFCANVAS_RENDER_TOKEN: ${PROOFCANVAS_RENDER_TOKEN:?set one private 32-256 character renderer token}
      PROOFCANVAS_RENDER_ROOT: /tmp/proofcanvas-render
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=3g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    memswap_limit: 4g
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    networks:
      - render-private
    logging:
      options:
        max-size: 10m
        max-file: "3"

  proofcanvas-maintenance:
    profiles:
      - maintenance
    build:
      context: .
      target: maintenance
    init: true
    read_only: true
    user: node
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PROOFCANVAS_DATA_DIR: /var/lib/proofcanvas
    volumes:
      - proofcanvas-data:/var/lib/proofcanvas
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    network_mode: none
    command:
      - node
      - -e
      - process.exit(0)

networks:
  edge:
  render-private:
    internal: true

volumes:
  proofcanvas-data:
